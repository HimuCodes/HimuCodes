name: Update Profile Card

on:
  push:
    branches: [main]
    paths:
      - "update_profile.py"
      - "dark.svg"
      - "light.svg"
      - "logo.png"
      - "cache/requirements.txt"
      - "tests/**"
      - ".github/workflows/profile_card.yml"
  schedule:
    # 03:17 UTC / 08:47 IST
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cache/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cache/requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Generate SVG
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          USER_NAME: ${{ github.repository_owner }}
          BIRTHDATE: "2005-01-17"
          DO_HEAVY: "1"
          FORCE_CACHE: "0"
          EMBED_FONT: "1"
          DEBUG: "0"
        run: python update_profile.py

      - name: Add cache buster to README
        run: |
          if [ -f README.md ]; then
            TS=$(date -u +%s)
            sed -i -E "s|(https://raw.githubusercontent.com/HimuCodes/HimuCodes/main/dark.svg)(\\?b=[0-9]+)?|\\1?b=${TS}|g" README.md
            sed -i -E "s|(https://raw.githubusercontent.com/HimuCodes/HimuCodes/main/light.svg)(\\?b=[0-9]+)?|\\1?b=${TS}|g" README.md
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dark.svg light.svg cache/*.txt README.md

          if git diff --cached --quiet; then
            echo "No tracked changes."
            exit 0
          fi

          git commit -m "chore: update profile card"
          git pull --rebase origin main
          git push origin HEAD:main
